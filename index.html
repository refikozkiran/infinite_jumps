<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Infinite Jumps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<!-- Firebase (bulut skor tablosu için) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --accent:#8B5CF6;
    --accent2:#22D3EE;
    --gold:#FFD166;
    --danger:#FF5D73;
    --glass:rgba(20,16,40,0.55);
    --glass-brd:rgba(255,255,255,0.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#0b0620; font-family:'Nunito',sans-serif; touch-action:none;
    overscroll-behavior:none;
  }
  #game{
    position:fixed; inset:0; display:block; width:100%; height:100%;
  }
  .layer{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
    pointer-events:none;
  }
  .layer.active{pointer-events:auto;}
  .hidden{display:none !important;}

  .card{
    background:var(--glass);
    border:1px solid var(--glass-brd);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    padding:28px 26px;
    width:min(92vw, 380px);
    max-height:88vh;
    overflow-y:auto;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }

  .title{
    font-family:'Baloo 2',sans-serif; font-weight:800;
    font-size:clamp(30px,9vw,42px);
    background:linear-gradient(135deg,#FDE68A,#F472B6 45%,#8B5CF6 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-align:center; letter-spacing:1px; margin:0;
    filter:drop-shadow(0 4px 14px rgba(139,92,246,0.4));
  }
  .subtitle{color:#C9C3E8; font-size:14px; text-align:center; margin:-8px 0 6px; font-weight:700; opacity:.85;}

  .statsRow{display:flex; gap:10px; width:100%;}
  .statChip{
    flex:1; background:rgba(255,255,255,0.06); border:1px solid var(--glass-brd);
    border-radius:16px; padding:10px 8px; text-align:center;
  }
  .statChip .lbl{font-size:11px; color:#B7B0DE; font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
  .statChip .val{font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:700; color:#fff; margin-top:2px;}
  .statChip .val.gold{color:var(--gold);}

  .btn{
    appearance:none; border:none; width:100%; padding:16px 20px; border-radius:20px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:19px; letter-spacing:.3px;
    color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .12s ease, filter .12s ease; -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(0.95); filter:brightness(0.92);}
  .btn-primary{ background:linear-gradient(135deg,#8B5CF6,#6D28D9); box-shadow:0 10px 24px rgba(139,92,246,0.45), inset 0 1px 0 rgba(255,255,255,0.25);}
  .btn-secondary{ background:linear-gradient(135deg,#22D3EE,#0891B2); box-shadow:0 10px 24px rgba(34,211,238,0.35), inset 0 1px 0 rgba(255,255,255,0.25);}
  .btn-ghost{ background:rgba(255,255,255,0.08); border:1px solid var(--glass-brd); box-shadow:none;}
  .btn-gold{ background:linear-gradient(135deg,#FFD166,#F59E0B); box-shadow:0 10px 24px rgba(245,158,11,0.4), inset 0 1px 0 rgba(255,255,255,0.35); color:#3b2400;}
  .btn small{font-size:12px; opacity:.8; font-weight:600;}

  .iconBtn{
    width:48px; height:48px; border-radius:16px; border:1px solid var(--glass-brd);
    background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
  }
  .iconBtn:active{transform:scale(0.9);}

  #topRight{position:fixed; top:calc(14px + env(safe-area-inset-top)); right:calc(14px + env(safe-area-inset-right)); display:flex; gap:10px; z-index:20; pointer-events:none;}
  #topRight .iconBtn{pointer-events:auto;}

  #hud{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); left:calc(14px + env(safe-area-inset-left));
    z-index:20; display:flex; flex-direction:column; gap:8px; pointer-events:none;
  }
  .hudChip{
    background:var(--glass); border:1px solid var(--glass-brd); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:16px; padding:8px 14px; display:flex; align-items:center; gap:8px;
    font-family:'Baloo 2',sans-serif; font-weight:700; color:#fff; font-size:16px;
    box-shadow:0 8px 20px rgba(0,0,0,0.28);
  }
  .hudChip .ic{font-size:16px;}
  .hudChip.gold{color:var(--gold);}

  #bestLine{
    position:fixed; left:0; right:0; height:0; z-index:5; pointer-events:none;
    border-top:2px dashed rgba(255,255,255,0.35);
  }
  #bestLine span{
    position:absolute; right:10px; top:-22px; font-family:'Baloo 2',sans-serif; font-size:11px; color:rgba(255,255,255,0.55); font-weight:700;
  }

  .newRecordBadge{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:14px; color:#3b2400;
    background:linear-gradient(135deg,#FFD166,#F59E0B); padding:6px 14px; border-radius:999px;
    box-shadow:0 6px 16px rgba(245,158,11,0.5); animation:pulseBadge 1s ease-in-out infinite;
  }
  @keyframes pulseBadge{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

  .shopGrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%;}
  .skinCard{
    background:rgba(255,255,255,0.06); border:2px solid var(--glass-brd); border-radius:20px;
    padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
    transition:border-color .15s ease, transform .12s ease; pointer-events:auto;
  }
  .skinCard:active{transform:scale(0.94);}
  .skinCard.equipped{border-color:var(--accent2); box-shadow:0 0 0 2px rgba(34,211,238,0.35);}
  .skinCard .skinName{font-weight:800; font-size:13px; color:#fff; font-family:'Baloo 2',sans-serif;}
  .skinCard .skinCost{font-size:11px; color:var(--gold); font-weight:700;}
  .skinCard canvas{width:56px; height:56px;}
  .skinTag{font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px; background:rgba(34,211,238,0.18); color:#7DE6F5;}
  .skinTag.locked{background:rgba(255,255,255,0.1); color:#B7B0DE;}

  .closeRow{width:100%; display:flex; justify-content:flex-start;}

  #touchHint{
    position:fixed; bottom:calc(28px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center;
    color:rgba(255,255,255,0.55); font-weight:700; font-size:13px; z-index:8; pointer-events:none;
    transition:opacity .5s ease;
  }

  ::-webkit-scrollbar{width:0;}

  .textInput{
    width:100%; background:rgba(255,255,255,0.08); border:1px solid var(--glass-brd);
    border-radius:16px; padding:14px 16px; font-family:'Nunito',sans-serif; font-weight:800;
    font-size:17px; color:#fff; text-align:center; outline:none;
  }
  .textInput::placeholder{color:#8A82B8;}
  .textInput:focus{border-color:var(--accent2);}

  .lbList{width:100%; display:flex; flex-direction:column; gap:8px; max-height:46vh; overflow-y:auto;}
  .lbRow{
    display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.05);
    border:1px solid var(--glass-brd); border-radius:14px; padding:10px 12px;
  }
  .lbRow.me{ background:rgba(139,92,246,0.22); border-color:rgba(139,92,246,0.55); }
  .lbRank{ font-family:'Baloo 2',sans-serif; font-weight:800; width:28px; text-align:center; color:#C9C3E8; font-size:15px; flex-shrink:0;}
  .lbRank.top1{color:#FFD166;} .lbRank.top2{color:#E5E7EB;} .lbRank.top3{color:#F59E0B;}
  .lbName{flex:1; font-weight:800; color:#fff; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lbScore{font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--gold); font-size:15px; flex-shrink:0;}
  .lbStatus{color:#B7B0DE; font-weight:700; font-size:14px; text-align:center; padding:10px 0;}
  .lbMeRow{width:100%;}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="bestLine" class="hidden"><span>EN İYİ</span></div>
<div id="touchHint" class="hidden">👆 Parmağınla sağa / sola sürükle</div>

<div id="hud" class="hidden">
  <div class="hudChip"><span class="ic">🏔️</span><span id="hudHeight">0 m</span></div>
  <div class="hudChip gold"><span class="ic">⭐</span><span id="hudCoins">0</span></div>
</div>
<div id="topRight">
  <div class="iconBtn hidden" id="pauseBtn">⏸️</div>
</div>

<!-- MENU -->
<div class="layer active" id="screen-menu">
  <div class="card">
    <h1 class="title">INFINITE<br>JUMPS</h1>
    <p class="subtitle">En yükseğe zıpla, yıldızları topla!</p>
    <div class="statsRow">
      <div class="statChip"><div class="lbl">En İyi</div><div class="val" id="menuBest">0 m</div></div>
      <div class="statChip"><div class="lbl">Yıldız</div><div class="val gold" id="menuStars">0 ⭐</div></div>
    </div>
    <button class="btn btn-primary" id="playBtn">🚀 OYNA</button>
    <button class="btn btn-secondary" id="shopBtn">🛍️ MAĞAZA</button>
    <button class="btn btn-gold" id="lbBtnMenu">🌍 SIRALAMA</button>
    <button class="iconBtn" id="soundBtnMenu" style="align-self:center; margin-top:2px;">🔊</button>
  </div>
</div>

<!-- SHOP -->
<div class="layer hidden" id="screen-shop">
  <div class="card">
    <h1 class="title" style="font-size:26px;">MAĞAZA</h1>
    <div class="statsRow">
      <div class="statChip"><div class="lbl">Yıldız</div><div class="val gold" id="shopStars">0 ⭐</div></div>
    </div>
    <div class="shopGrid" id="shopGrid"></div>
    <div class="closeRow">
      <button class="btn btn-ghost" id="shopBackBtn">⬅️ Geri</button>
    </div>
  </div>
</div>

<!-- PAUSE -->
<div class="layer hidden" id="screen-pause">
  <div class="card">
    <h1 class="title" style="font-size:28px;">DURAKLATILDI</h1>
    <button class="btn btn-primary" id="resumeBtn">▶️ Devam Et</button>
    <button class="btn btn-secondary" id="restartFromPauseBtn">🔄 Yeniden Başla</button>
    <button class="btn btn-ghost" id="homeFromPauseBtn">🏠 Ana Menü</button>
  </div>
</div>

<!-- GAME OVER -->
<div class="layer hidden" id="screen-over">
  <div class="card">
    <h1 class="title" style="font-size:30px;">OYUN BİTTİ</h1>
    <div id="recordBadgeSlot"></div>
    <div class="statsRow">
      <div class="statChip"><div class="lbl">Yükseklik</div><div class="val" id="overHeight">0 m</div></div>
      <div class="statChip"><div class="lbl">Yıldız</div><div class="val gold" id="overCoins">0 ⭐</div></div>
    </div>
    <button class="btn btn-primary" id="retryBtn">🔄 TEKRAR OYNA</button>
    <button class="btn btn-gold" id="lbBtnOver">🌍 SIRALAMA</button>
    <button class="btn btn-secondary" id="shopFromOverBtn">🛍️ MAĞAZA</button>
    <button class="btn btn-ghost" id="homeBtn">🏠 Ana Menü</button>
  </div>
</div>

<!-- NICKNAME -->
<div class="layer hidden" id="screen-nickname">
  <div class="card">
    <h1 class="title" style="font-size:28px;">TAKMA ADIN</h1>
    <p class="subtitle">Dünya sıralamasında bu isimle görünürsün</p>
    <input type="text" class="textInput" id="nicknameInput" placeholder="Örn: Refik" maxlength="14">
    <button class="btn btn-primary" id="nicknameSaveBtn">✅ KAYDET</button>
  </div>
</div>

<!-- LEADERBOARD -->
<div class="layer hidden" id="screen-leaderboard">
  <div class="card">
    <h1 class="title" style="font-size:28px;">🌍 DÜNYA SIRALAMASI</h1>
    <div class="lbList" id="lbList"><div class="lbStatus">Yükleniyor...</div></div>
    <div class="lbMeRow" id="lbMeRow"></div>
    <button class="btn btn-ghost" id="lbChangeNameBtn">✏️ İsmimi Değiştir</button>
    <button class="btn btn-ghost" id="lbBackBtn">⬅️ Geri</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================= STORAGE ============================= */
const StoreKeys = { best:'ij_best', stars:'ij_stars', skins:'ij_skins', equipped:'ij_equipped', sound:'ij_sound', playerId:'ij_pid', playerName:'ij_pname' };
function loadNum(key, def){ const v = localStorage.getItem(key); return v===null? def : (parseInt(v,10)||def); }
function saveNum(key, val){ localStorage.setItem(key, String(val)); }
function loadJSON(key, def){ try{ const v = localStorage.getItem(key); return v? JSON.parse(v): def; }catch(e){ return def; } }
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

let bestHeight = loadNum(StoreKeys.best, 0);
let totalStars = loadNum(StoreKeys.stars, 0);
let ownedSkins = loadJSON(StoreKeys.skins, ['klasik']);
let equippedSkin = localStorage.getItem(StoreKeys.equipped) || 'klasik';
let soundOn = loadNum(StoreKeys.sound, 1) === 1;

/* ============================= AUDIO ============================= */
const Audio1 = (function(){
  let ctx = null;
  function ensure(){ if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)(); } if(ctx.state==='suspended'){ ctx.resume(); } return ctx; }
  function tone(freq, dur, type, vol, when, glideTo){
    if(!soundOn) return;
    const c = ensure();
    const t0 = c.currentTime + (when||0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo), t0+dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol||0.25, t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  return {
    jump(){ tone(420,0.11,'sine',0.22,0,620); },
    spring(){ tone(260,0.22,'sawtooth',0.22,0,760); tone(180,0.16,'triangle',0.15,0.02,520); },
    coin(){ tone(880,0.09,'square',0.14,0,1180); tone(1180,0.08,'sine',0.12,0.05); },
    powerup(){ tone(300,0.09,'triangle',0.2,0); tone(460,0.09,'triangle',0.2,0.07); tone(680,0.14,'triangle',0.22,0.14); },
    breakP(){ tone(140,0.14,'sawtooth',0.2,0,60); },
    hit(){ tone(160,0.3,'sawtooth',0.25,0,50); },
    shield(){ tone(500,0.1,'square',0.2,0); tone(700,0.12,'square',0.18,0.06); },
    gameOver(){ tone(340,0.18,'triangle',0.22,0,220); tone(220,0.28,'triangle',0.2,0.16,90); },
    click(){ tone(520,0.05,'square',0.14,0); },
    record(){ tone(520,0.1,'triangle',0.2,0); tone(660,0.1,'triangle',0.2,0.09); tone(880,0.16,'triangle',0.24,0.18); }
  };
})();

/* ============================= CANVAS / SCALE ============================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VW = 400; // sabit dünya genişliği (world units)
let W=0,H=0,DPR=1,scale=1,worldViewH=0;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  scale = W / VW;
  worldViewH = H / scale;
}
window.addEventListener('resize', resize);
resize();

/* ============================= UTILS ============================= */
function rand(a,b){ return a + Math.random()*(b-a); }
function randInt(a,b){ return Math.floor(rand(a,b+1)); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function lerpColor(c1,c2,t){
  const p=(h)=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(c1), b=p(c2);
  const r=Math.round(lerp(a[0],b[0],t)), g=Math.round(lerp(a[1],b[1],t)), bl=Math.round(lerp(a[2],b[2],t));
  return `rgb(${r},${g},${bl})`;
}

/* ============================= SKINS ============================= */
const SKINS = [
  { id:'klasik', name:'Klasik',  cost:0,   a:'#8B5CF6', b:'#C4B5FD', eye:'#2b2140' },
  { id:'okyanus',name:'Okyanus', cost:120, a:'#22D3EE', b:'#A5F3FC', eye:'#093a44' },
  { id:'orman',  name:'Orman',   cost:120, a:'#34D399', b:'#BBF7D0', eye:'#0b3d2c' },
  { id:'lav',    name:'Lav',     cost:260, a:'#FB7185', b:'#FDBA74', eye:'#4a0d0d' },
  { id:'buzul',  name:'Buzul',   cost:260, a:'#67E8F9', b:'#F0F9FF', eye:'#164e63', sparkle:false },
  { id:'altin',  name:'Altın',   cost:500, a:'#FFD166', b:'#FFF3C4', eye:'#4a2e00', sparkle:true },
];
function getSkin(id){ return SKINS.find(s=>s.id===id) || SKINS[0]; }

/* ============================= INPUT ============================= */
let touchTargetX = VW/2;
let touching = false;
function pointerX(clientX){ return clamp((clientX/ W) * VW, 16, VW-16); }
canvas.addEventListener('touchstart', e=>{ touching=true; touchTargetX = pointerX(e.touches[0].clientX); }, {passive:true});
canvas.addEventListener('touchmove', e=>{ touchTargetX = pointerX(e.touches[0].clientX); }, {passive:true});
canvas.addEventListener('touchend', ()=>{ touching=false; }, {passive:true});
canvas.addEventListener('mousedown', e=>{ touching=true; touchTargetX = pointerX(e.clientX); });
window.addEventListener('mousemove', e=>{ if(touching) touchTargetX = pointerX(e.clientX); });
window.addEventListener('mouseup', ()=>{ touching=false; });
// keyboard for desktop testing
const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.key]=true;
  if(e.key==='Escape'){
    if(state===STATE.PLAYING) doPause();
    else if(state===STATE.PAUSED){ document.getElementById('resumeBtn').click(); }
  }
});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

/* ============================= GAME STATE ============================= */
const STATE = { MENU:'menu', PLAYING:'playing', PAUSED:'paused', OVER:'over' };
let state = STATE.MENU;

const GRAVITY = 0.62;
const JUMP_V = -15.5;
const SPRING_MULT = 1.55;

let player = { x: VW/2, y:0, vx:0, vy:0, w:32, h:32, facing:1, squash:1, stretch:1, invuln:0, shield:false, jetpackT:0, magnetT:0, trail:[] };
let camera = { top: -worldViewH*0.66 };
let platforms = [], coins = [], powerups = [], enemies = [], particles = [], bgDecor = [];
let runStars = 0, heightScore = 0, highestGeneratedY = 40, lastPowerupAtHeight = 0;
let shakeT = 0, shakeMag = 0;
let recordBrokenThisRun = false, recordConfettiFired = false;

function newRun(){
  player = {
    x: VW/2, y: 0, vx:0, vy:0, w:32, h:32,
    facing:1, squash:1, stretch:1, invuln:0, shield:false, jetpackT:0, magnetT:0,
    trail:[]
  };
  const startY = 0; // baseline; will set camera accordingly
  player.y = startY;
  camera = { top: startY - worldViewH*0.66 };
  platforms = []; coins = []; powerups = []; enemies = []; particles = []; bgDecor = [];
  runStars = 0; heightScore = 0; highestGeneratedY = startY + 40;
  lastPowerupAtHeight = 0;
  shakeT = 0; shakeMag = 0;
  recordBrokenThisRun = false; recordConfettiFired = false;
  touchTargetX = VW/2;

  // ilk zemin platformu (oyuncunun tam altında, güvenli)
  platforms.push(makePlatform(VW/2 - 34, startY + 30, 'normal'));
  // başlangıç istifi
  while(highestGeneratedY > camera.top - worldViewH*1.3){
    spawnNextPlatform();
  }
  fillBgDecor(true);
}

function difficultyAt(h){
  // h = height climbed (positive)
  return clamp(h/4000, 0, 1);
}

function makePlatform(x, y, type){
  return { x, y, w:68, h:16, type, dead:false,
    // moving
    baseX:x, moveAmp: rand(30,70), moveSpeed: rand(0.6,1.3), movePhase: rand(0,Math.PI*2),
    // breakable
    cracked:false, breakT:0,
    // spring
    springT:0
  };
}

function spawnNextPlatform(){
  const h = Math.max(0, -(highestGeneratedY));
  const diff = difficultyAt(h);
  const gapMin = lerp(64, 88, diff), gapMax = lerp(100, 148, diff);
  const gap = rand(gapMin, gapMax);
  const y = highestGeneratedY - gap;
  const x = rand(14, VW-14-68);

  let type = 'normal';
  const r = Math.random();
  if(h > 600 && r < lerp(0,0.22,diff)) type = 'moving';
  else if(h > 1000 && r < lerp(0,0.22,diff)+lerp(0,0.16,diff)) type = 'breakable';
  else if(r > 0.90 - diff*0.03) type = 'spring';

  const p = makePlatform(x, y, type);
  platforms.push(p);
  highestGeneratedY = y;

  // coin şansı
  if(Math.random() < 0.5){
    const cx = clamp(x + rand(-10,78), 16, VW-16);
    coins.push({ x:cx, y:y - rand(18,34), r:9, t:rand(0,10), taken:false });
  }
  // enemy (yüksek irtifada)
  if(h > 1400 && Math.random() < lerp(0,0.10,diff)){
    enemies.push({ x: rand(40,VW-40), y: y - rand(50,90), r:14, amp:rand(40,90), speed:rand(0.5,1.1), phase:rand(0,Math.PI*2), baseX: rand(60,VW-60), alive:true });
  }
  // powerup (irtifa aralığına göre nadir)
  if(h - lastPowerupAtHeight > rand(550,900)){
    lastPowerupAtHeight = h;
    const types = ['jetpack','shield','magnet'];
    const t = types[randInt(0,types.length-1)];
    powerups.push({ x: clamp(x+34, 24, VW-24), y: y - rand(30,50), r:15, type:t, taken:false, bob:rand(0,10) });
  }
}

function fillBgDecor(initial){
  const targetTop = camera.top - worldViewH*(initial?2.2:1.4);
  while(bgDecor.length===0 || bgDecor[bgDecor.length-1].y > targetTop){
    const y = bgDecor.length? bgDecor[bgDecor.length-1].y - rand(70,160) : camera.top - rand(0,40);
    const h = Math.max(0,-y);
    let kind = 'cloud';
    if(h>3000) kind='star';
    else if(h>1500) kind = Math.random()<0.5?'cloud':'star';
    bgDecor.push({ x:rand(10,VW-10), y, kind, s:rand(0.5,1.3), tw:rand(0,10) });
  }
}

/* ============================= SKY / STAGES ============================= */
const STOPS = [
  { h:0,    top:'#FFD9A0', bot:'#FFB6C1' },
  { h:700,  top:'#8EC5FC', bot:'#EAF7FB' },
  { h:2000, top:'#FF9A76', bot:'#5B4B7A' },
  { h:3800, top:'#1B1035', bot:'#3A1C71' },
  { h:6500, top:'#04030F', bot:'#170B33' },
];
function skyColors(h){
  h = Math.max(0,h);
  if(h <= STOPS[0].h) return [STOPS[0].top, STOPS[0].bot];
  for(let i=0;i<STOPS.length-1;i++){
    if(h>=STOPS[i].h && h<=STOPS[i+1].h){
      const t = (h-STOPS[i].h)/(STOPS[i+1].h-STOPS[i].h);
      return [lerpColor(STOPS[i].top,STOPS[i+1].top,t), lerpColor(STOPS[i].bot,STOPS[i+1].bot,t)];
    }
  }
  return [STOPS[STOPS.length-1].top, STOPS[STOPS.length-1].bot];
}
function platformTint(h){
  if(h<700) return {a:'#9AE6B4', b:'#68D391'};       // çim
  if(h<2000) return {a:'#F6C453', b:'#E0A526'};      // gün batımı kum
  if(h<3800) return {a:'#B794F4', b:'#805AD5'};      // gece moru
  return {a:'#63E6E8', b:'#2CB1B3'};                 // uzay buzu
}

/* ============================= PARTICLES ============================= */
function spawnParticles(x,y,count,opts){
  opts = opts||{};
  for(let i=0;i<count;i++){
    particles.push({
      x,y,
      vx: rand(opts.vxMin??-2, opts.vxMax??2),
      vy: rand(opts.vyMin??-3, opts.vyMax??0.5),
      life: rand(opts.lifeMin??20, opts.lifeMax??40),
      maxLife: 40,
      size: rand(opts.sizeMin??2, opts.sizeMax??4),
      color: opts.color || '#fff',
      grav: opts.grav ?? 0.15,
      shape: opts.shape || 'circle'
    });
  }
}
function updateParticles(ts){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.vy += p.grav*ts; p.x += p.vx*ts; p.y += p.vy*ts; p.life -= ts;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    const alpha = clamp(p.life/ (p.maxLife||30), 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    if(p.shape==='rect'){
      ctx.fillRect(p.x-p.size/2, worldToScreenY(p.y)-p.size/2, p.size, p.size);
    } else {
      ctx.beginPath(); ctx.arc(p.x, worldToScreenY(p.y), p.size, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ============================= WORLD <-> SCREEN ============================= */
function worldToScreenY(y){ return (y - camera.top); }

/* ============================= UPDATE ============================= */
function updatePlayer(ts){
  // yatay kontrol: dokunmatik hedefe yumuşak takip + klavye (masaüstü test)
  let target = touchTargetX;
  if(keys['ArrowLeft']||keys['a']) target = player.x - 60;
  if(keys['ArrowRight']||keys['d']) target = player.x + 60;
  const follow = touching || keys['ArrowLeft'] || keys['ArrowRight'] || keys['a'] || keys['d'];
  if(follow){
    player.x += (target - player.x) * clamp(0.18*ts,0,1);
  }
  player.facing = (target > player.x) ? 1 : (target < player.x ? -1 : player.facing);

  // dünya sarma (wrap-around)
  if(player.x < -18) player.x = VW+18;
  if(player.x > VW+18) player.x = -18;

  if(player.jetpackT > 0){
    player.jetpackT -= ts*16.67;
    player.vy = -9.6;
    player.y += player.vy*ts;
    if(Math.random()<0.6) spawnParticles(player.x, player.y+16, 2, {vxMin:-1.5,vxMax:1.5,vyMin:1,vyMax:3,color: Math.random()<0.5?'#FFB020':'#FF6B35', sizeMin:2,sizeMax:4, grav:-0.05, lifeMin:10,lifeMax:18});
  } else {
    player.vy += GRAVITY*ts;
    player.y += player.vy*ts;
  }

  if(player.magnetT>0) player.magnetT -= ts*16.67;
  if(player.invuln>0) player.invuln -= ts*16.67;

  // platform çarpışması (sadece düşerken)
  if(player.vy > 0 && player.jetpackT<=0){
    for(const p of platforms){
      if(p.dead) continue;
      if(p.type==='breakable' && p.cracked) continue;
      const px = p.type==='moving' ? p.x : p.x;
      const withinX = (player.x+10) > px && (player.x-10) < px+p.w;
      const prevFoot = player.y - player.vy*ts + player.h/2;
      const foot = player.y + player.h/2;
      const platTop = p.y;
      if(withinX && prevFoot <= platTop+6 && foot >= platTop-2 && foot <= platTop+14){
        landOn(p);
        break;
      }
    }
  }

  // güç yükseklik takibi
  const climbed = Math.max(0, -player.y);
  if(climbed > heightScore) heightScore = climbed;

  // kamera (sadece yukarı gider)
  const desired = player.y - worldViewH*0.42;
  camera.top = Math.min(camera.top, desired);

  // squash/stretch
  const vyN = clamp(player.vy/18, -1, 1);
  player.stretch = 1 + Math.max(0,-vyN)*0.22;
  player.squash = 1 - Math.max(0,-vyN)*0.16;

  // rekor kırma anı
  if(!recordBrokenThisRun && heightScore/8 > bestHeight){
    recordBrokenThisRun = true;
  }
}

function landOn(p){
  let vBase = JUMP_V;
  if(p.type==='spring'){
    vBase = JUMP_V*SPRING_MULT; p.springT = 10; shake(6,10); Audio1.spring();
    spawnParticles(p.x+p.w/2, p.y, 10, {vxMin:-2,vxMax:2,vyMin:-4,vyMax:-1,color:'#22D3EE',sizeMin:2,sizeMax:4});
  } else if(p.type==='breakable'){
    p.cracked = true; p.breakT = 0; Audio1.breakP();
    spawnParticles(p.x+p.w/2, p.y, 8, {vxMin:-2.5,vxMax:2.5,vyMin:-1,vyMax:1,color:'#B08968',shape:'rect',sizeMin:3,sizeMax:5});
    Audio1.jump();
  } else {
    Audio1.jump();
  }
  player.vy = vBase;
  player.y = p.y - player.h/2;
  spawnParticles(player.x, player.y+player.h/2, 6, {vxMin:-1.5,vxMax:1.5,vyMin:-0.5,vyMax:0.5,color:'rgba(255,255,255,0.7)',sizeMin:2,sizeMax:3.5,grav:0.02});
}

function updatePlatforms(ts){
  for(const p of platforms){
    if(p.type==='moving'){
      p.movePhase += 0.02*p.moveSpeed*ts;
      p.x = clamp(p.baseX + Math.sin(p.movePhase)*p.moveAmp, 8, VW-8-p.w);
    }
    if(p.springT>0) p.springT -= ts;
    if(p.cracked){ p.breakT += ts; if(p.breakT>14) p.dead = true; }
  }
  // temizle
  const limit = camera.top + worldViewH + 120;
  platforms = platforms.filter(p=> !p.dead && p.y < limit);
  while(highestGeneratedY > camera.top - worldViewH*1.2){ spawnNextPlatform(); }
}

function updateCoinsPowerups(ts){
  for(const c of coins){
    c.t += ts*0.1;
    if(c.taken) continue;
    let dx = c.x-player.x, dy=c.y-player.y;
    let dist = Math.hypot(dx,dy);
    if(player.magnetT>0 && dist<95){
      c.x -= dx*0.14*ts; c.y -= dy*0.14*ts; dist = Math.hypot(c.x-player.x,c.y-player.y);
    }
    if(dist < 22){
      c.taken = true; runStars++; Audio1.coin();
      spawnParticles(c.x,c.y,8,{vxMin:-2,vxMax:2,vyMin:-3,vyMax:-0.5,color:'#FFD166',sizeMin:2,sizeMax:3.5, grav:0.08});
    }
  }
  coins = coins.filter(c=> !c.taken && c.y < camera.top+worldViewH+100);

  for(const pu of powerups){
    pu.bob += ts*0.1;
    if(pu.taken) continue;
    const dist = Math.hypot(pu.x-player.x, pu.y-player.y);
    if(dist < 24){
      pu.taken = true; Audio1.powerup();
      if(pu.type==='jetpack'){ player.jetpackT = 2200; }
      else if(pu.type==='shield'){ player.shield = true; }
      else if(pu.type==='magnet'){ player.magnetT = 5200; }
      spawnParticles(pu.x,pu.y,14,{vxMin:-3,vxMax:3,vyMin:-3,vyMax:1,color:'#22D3EE',sizeMin:2,sizeMax:4});
    }
  }
  powerups = powerups.filter(p=> !p.taken && p.y < camera.top+worldViewH+100);
}

function updateEnemies(ts){
  for(const e of enemies){
    if(!e.alive) continue;
    e.phase += 0.02*e.speed*ts;
    e.x = clamp(e.baseX + Math.sin(e.phase)*e.amp, 20, VW-20);
    if(player.invuln<=0){
      const dist = Math.hypot(e.x-player.x, e.y-player.y);
      if(dist < e.r + 10){
        if(player.shield){
          player.shield = false; e.alive=false; player.invuln=700; Audio1.shield();
          spawnParticles(e.x,e.y,16,{vxMin:-3,vxMax:3,vyMin:-3,vyMax:3,color:'#22D3EE',sizeMin:2,sizeMax:4});
        } else {
          triggerGameOver(true);
        }
      }
    }
  }
  enemies = enemies.filter(e=> e.alive && e.y < camera.top+worldViewH+100);
}

function shake(mag, t){ shakeMag = mag; shakeT = t; }

/* ============================= GAME OVER / RESET ============================= */
function triggerGameOver(hit){
  if(state===STATE.OVER) return;
  state = STATE.OVER;
  if(hit){ Audio1.hit(); shake(10,14); }
  Audio1.gameOver();
  const finalHeight = Math.round(heightScore/8);
  let newRecord = false;
  if(finalHeight > bestHeight){ bestHeight = finalHeight; saveNum(StoreKeys.best, bestHeight); newRecord = true; Audio1.record(); maybeSubmitScore(bestHeight); }
  totalStars += runStars; saveNum(StoreKeys.stars, totalStars);

  document.getElementById('overHeight').textContent = finalHeight+' m';
  document.getElementById('overCoins').textContent = runStars+' ⭐';
  const slot = document.getElementById('recordBadgeSlot');
  slot.innerHTML = newRecord ? '<div class="newRecordBadge">🏆 YENİ REKOR!</div>' : '';
  if(newRecord) confettiBurst();

  showScreen('screen-over');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('pauseBtn').classList.add('hidden');
  document.getElementById('bestLine').classList.add('hidden');
}

function confettiBurst(){
  for(let i=0;i<40;i++){
    particles.push({
      x: rand(0,VW), y: camera.top - rand(0,20),
      vx: rand(-2,2), vy: rand(-1,1), life: rand(40,80), maxLife:80,
      size: rand(3,6), color:['#FFD166','#8B5CF6','#22D3EE','#F472B6'][randInt(0,3)], grav:0.06, shape:'rect'
    });
  }
}

/* ============================= RENDER ============================= */
function drawBackground(){
  const h = Math.max(0, heightScore);
  const [top,bot] = skyColors(h);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  for(const d of bgDecor){
    const sy = worldToScreenY(d.y);
    if(sy < -40 || sy > H+40) continue;
    if(d.kind==='cloud'){
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(d.x, sy, 22*d.s, 10*d.s, 0, 0, Math.PI*2);
      ctx.ellipse(d.x+14*d.s, sy+3, 16*d.s, 8*d.s, 0, 0, Math.PI*2);
      ctx.ellipse(d.x-14*d.s, sy+3, 16*d.s, 8*d.s, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      const tw = 0.5+0.5*Math.sin((Date.now()/500)+d.tw);
      ctx.globalAlpha = 0.4+0.6*tw;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(d.x, sy, 1.6*d.s, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  fillBgDecor(false);
}

function drawPlatform(p){
  const sy = worldToScreenY(p.y);
  if(sy < -30 || sy > H+30) return;
  const tint = platformTint(Math.max(0,-p.y));
  ctx.save();
  if(p.cracked){
    const t = clamp(p.breakT/14,0,1);
    ctx.globalAlpha = 1-t;
    ctx.translate(p.x+p.w/2, sy+p.h/2 + t*10);
    ctx.scale(1, 1-t*0.5);
    ctx.translate(-(p.x+p.w/2), -(sy+p.h/2));
  }
  const grad = ctx.createLinearGradient(p.x, sy, p.x, sy+p.h);
  grad.addColorStop(0, tint.a); grad.addColorStop(1, tint.b);
  ctx.fillStyle = grad;
  roundRect(p.x, sy, p.w, p.h, 8);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)';
  roundRect(p.x+3, sy+2, p.w-6, 3, 2); ctx.fill();

  if(p.type==='spring'){
    ctx.strokeStyle='#5B4B7A'; ctx.lineWidth=2.4; ctx.beginPath();
    const cx = p.x+p.w/2; const comp = p.springT>0? 4:0;
    for(let i=0;i<4;i++){
      const yy = sy - 2 - i*3 + comp;
      ctx.moveTo(cx-9, yy); ctx.lineTo(cx+9, yy-2);
    }
    ctx.stroke();
  }
  if(p.type==='breakable' && !p.cracked){
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(p.x+14, sy+2); ctx.lineTo(p.x+22, sy+p.h-2);
    ctx.moveTo(p.x+40, sy+3); ctx.lineTo(p.x+34, sy+p.h-2);
    ctx.moveTo(p.x+52, sy+1); ctx.lineTo(p.x+58, sy+p.h-3);
    ctx.stroke();
  }
  if(p.type==='moving'){
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.moveTo(p.x+p.w+3, sy+p.h/2-4); ctx.lineTo(p.x+p.w+9, sy+p.h/2); ctx.lineTo(p.x+p.w+3, sy+p.h/2+4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(p.x-3, sy+p.h/2-4); ctx.lineTo(p.x-9, sy+p.h/2); ctx.lineTo(p.x-3, sy+p.h/2+4); ctx.fill();
  }
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawCoin(c){
  if(c.taken) return;
  const sy = worldToScreenY(c.y);
  if(sy<-20||sy>H+20) return;
  const bob = Math.sin(c.t)*3;
  const spin = Math.sin(c.t*1.4);
  ctx.save();
  ctx.translate(c.x, sy+bob);
  ctx.scale(Math.max(0.25,Math.abs(spin)), 1);
  ctx.fillStyle = '#FFD166';
  drawStar(0,0,5,9,4.2);
  ctx.fillStyle = '#FFF3C4';
  drawStar(0,0,5,5,2.2);
  ctx.restore();
}
function drawStar(cx,cy,spikes,outerR,innerR){
  let rot = Math.PI/2*3, x=cx, y=cy; const step = Math.PI/spikes;
  ctx.beginPath(); ctx.moveTo(cx, cy-outerR);
  for(let i=0;i<spikes;i++){
    x = cx + Math.cos(rot)*outerR; y = cy + Math.sin(rot)*outerR; ctx.lineTo(x,y); rot+=step;
    x = cx + Math.cos(rot)*innerR; y = cy + Math.sin(rot)*innerR; ctx.lineTo(x,y); rot+=step;
  }
  ctx.lineTo(cx, cy-outerR); ctx.closePath(); ctx.fill();
}

function drawPowerup(pu){
  if(pu.taken) return;
  const sy = worldToScreenY(pu.y);
  if(sy<-30||sy>H+30) return;
  const bob = Math.sin(pu.bob)*3;
  ctx.save();
  ctx.translate(pu.x, sy+bob);
  ctx.beginPath(); ctx.arc(0,0,17,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.4; ctx.stroke();
  if(pu.type==='jetpack'){
    ctx.fillStyle='#F97316';
    roundRect(-5,-9,10,16,3); ctx.fill();
    ctx.fillStyle='#FDBA74'; ctx.beginPath(); ctx.moveTo(-5,7); ctx.lineTo(0,15); ctx.lineTo(5,7); ctx.fill();
    ctx.fillStyle='#7DD3FC'; ctx.beginPath(); ctx.arc(0,-3,2.6,0,Math.PI*2); ctx.fill();
  } else if(pu.type==='shield'){
    ctx.fillStyle='#22D3EE';
    ctx.beginPath();
    ctx.moveTo(0,-10); ctx.lineTo(8,-5); ctx.lineTo(8,4); ctx.lineTo(0,11); ctx.lineTo(-8,4); ctx.lineTo(-8,-5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-3,0); ctx.lineTo(-1,3); ctx.lineTo(4,-3); ctx.stroke();
  } else {
    ctx.strokeStyle='#EF4444'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,2,7,Math.PI*0.15,Math.PI*0.85); ctx.stroke();
    ctx.fillStyle='#D1D5DB';
    ctx.fillRect(-9,-2,3,7); ctx.fillRect(6,-2,3,7);
  }
  ctx.restore();
}

function drawEnemy(e){
  if(!e.alive) return;
  const sy = worldToScreenY(e.y);
  if(sy<-30||sy>H+30) return;
  const flap = Math.sin(Date.now()/90)*6;
  const pulse = 0.55+0.45*Math.sin(Date.now()/220);
  ctx.save(); ctx.translate(e.x, sy);

  // her fon renginde seçilsin diye dış uyarı halkası (koyu + parlak)
  ctx.globalAlpha = 0.28*pulse;
  ctx.fillStyle = '#FF3B30';
  ctx.beginPath(); ctx.arc(0,0,19,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0,0,14.5,0,Math.PI*2); ctx.stroke();

  // kanatlar (parlak turuncu)
  ctx.fillStyle='#FF9F43';
  ctx.beginPath(); ctx.ellipse(-13,flap*0.3,8,4,0.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13,-flap*0.3,8,4,-0.4,0,Math.PI*2); ctx.fill();

  // gövde (canlı kırmızı, beyaz kontur)
  ctx.fillStyle='#FF3B30';
  ctx.beginPath(); ctx.ellipse(0,0,11,9,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.ellipse(0,0,11,9,0,0,Math.PI*2); ctx.stroke();

  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-3,-1,2.4,0,Math.PI*2); ctx.arc(4,-1,2.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1F2937';
  ctx.beginPath(); ctx.arc(-3,-1,1.1,0,Math.PI*2); ctx.arc(4,-1,1.1,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPlayer(){
  const sy = worldToScreenY(player.y);
  const skin = getSkin(equippedSkin);
  ctx.save();
  ctx.translate(player.x, sy);
  ctx.rotate(clamp(player.vx||0,-0.3,0.3));
  ctx.scale(player.squash, player.stretch);

  if(player.shield){
    ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2);
    ctx.strokeStyle='rgba(34,211,238,0.8)'; ctx.lineWidth=2.4; ctx.stroke();
  }
  if(player.invuln>0 && Math.floor(Date.now()/80)%2===0){ ctx.globalAlpha=0.4; }

  const grad = ctx.createLinearGradient(0,-16,0,16);
  grad.addColorStop(0, skin.b); grad.addColorStop(1, skin.a);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();

  if(skin.sparkle){
    ctx.fillStyle='rgba(255,255,255,0.8)';
    for(let i=0;i<3;i++){
      const a = Date.now()/300 + i*2;
      ctx.beginPath(); ctx.arc(Math.cos(a)*11, Math.sin(a)*11, 1.4, 0, Math.PI*2); ctx.fill();
    }
  }

  // gözler
  const eyeDX = player.facing*3.5;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(eyeDX-4,-2,4.4,0,Math.PI*2); ctx.arc(eyeDX+4,-2,4.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle= skin.eye;
  ctx.beginPath(); ctx.arc(eyeDX-4+player.facing*1.2,-2,2.1,0,Math.PI*2); ctx.arc(eyeDX+4+player.facing*1.2,-2,2.1,0,Math.PI*2); ctx.fill();

  ctx.globalAlpha=1;
  ctx.restore();

  if(player.jetpackT>0){
    ctx.save(); ctx.translate(player.x, sy+16);
    ctx.fillStyle='#94A3B8'; roundRect(-9,-2,18,10,3); ctx.fill();
    ctx.restore();
  }
}

function render(){
  ctx.save();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(shakeT>0){
    ctx.translate(rand(-shakeMag,shakeMag), rand(-shakeMag,shakeMag));
  }
  drawBackground();
  ctx.save(); ctx.scale(scale,scale);
  for(const p of platforms) drawPlatform(p);
  for(const c of coins) drawCoin(c);
  for(const pu of powerups) drawPowerup(pu);
  for(const e of enemies) drawEnemy(e);
  drawParticles();
  if(state===STATE.PLAYING || state===STATE.PAUSED) drawPlayer();
  ctx.restore();
  ctx.restore();
}

/* ============================= LOOP ============================= */
let lastT = performance.now();
function frame(now){
  const dtMs = clamp(now-lastT, 0, 40); lastT = now;
  const ts = dtMs/16.67;

  if(state===STATE.PLAYING){
    updatePlayer(ts);
    updatePlatforms(ts);
    updateCoinsPowerups(ts);
    updateEnemies(ts);
    updateParticles(ts);
    if(shakeT>0) shakeT -= ts;
    updateHUD();
    if(player.y - camera.top > worldViewH + 60){
      triggerGameOver(false);
    }
  } else {
    updateParticles(ts);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

  hudHeightEl.textContent = Math.round(heightScore/8)+' m';

    const bestWorldY = -(bestHeight*8);
    const sy = worldToScreenY(bestWorldY);
    if(sy > -40 && sy < H+40 && !recordBrokenThisRun){
      bestLineEl.style.top = sy+'px';

    } else {
      bestLineEl.classList.add('hidden');
    }
    if(recordBrokenThisRun && !recordConfettiFired){
      recordConfettiFired = true;
      confettiBurst();
    }
  }
}

/* ============================= SHOP RENDER ============================= */
function drawSkinPreview(canvasEl, skin){
  const c = canvasEl.getContext('2d');
  const s = canvasEl.width;
  c.clearRect(0,0,s,s);
  const grad = c.createLinearGradient(0,0,0,s);
  grad.addColorStop(0, skin.b); grad.addColorStop(1, skin.a);
  c.fillStyle = grad;
  c.beginPath(); c.arc(s/2, s/2, s*0.36, 0, Math.PI*2); c.fill();
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(s/2-6, s/2-3, 5, 0, Math.PI*2); c.arc(s/2+6, s/2-3, 5, 0, Math.PI*2); c.fill();
  c.fillStyle = skin.eye;
  c.beginPath(); c.arc(s/2-6, s/2-3, 2.4, 0, Math.PI*2); c.arc(s/2+6, s/2-3, 2.4, 0, Math.PI*2); c.fill();
  if(skin.sparkle){
    c.fillStyle='rgba(255,255,255,0.9)';
    c.beginPath(); c.arc(s*0.72,s*0.32,1.8,0,Math.PI*2); c.arc(s*0.28,s*0.68,1.6,0,Math.PI*2); c.fill();
  }
}
function openShop(){
  document.getElementById('shopStars').textContent = totalStars+' ⭐';
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  for(const skin of SKINS){
    const owned = ownedSkins.includes(skin.id);
    const equipped = equippedSkin === skin.id;
    const card = document.createElement('div');
    card.className = 'skinCard' + (equipped? ' equipped':'');
    const cv = document.createElement('canvas'); cv.width=64; cv.height=64;
    card.appendChild(cv);
    const nm = document.createElement('div'); nm.className='skinName'; nm.textContent = skin.name; card.appendChild(nm);
    const tag = document.createElement('div');
    if(equipped){ tag.className='skinTag'; tag.textContent='Kullanılıyor'; }
    else if(owned){ tag.className='skinTag'; tag.textContent='Sahipsin • Seç'; }
    else { tag.className='skinTag locked'; tag.textContent = skin.cost+' ⭐'; }
    card.appendChild(tag);
    card.addEventListener('click', ()=>{
      if(owned){
        equippedSkin = skin.id; localStorage.setItem(StoreKeys.equipped, equippedSkin);
        Audio1.click(); openShop();
      } else if(totalStars >= skin.cost){
        totalStars -= skin.cost; saveNum(StoreKeys.stars, totalStars);
        ownedSkins.push(skin.id); saveJSON(StoreKeys.skins, ownedSkins);
        equippedSkin = skin.id; localStorage.setItem(StoreKeys.equipped, equippedSkin);
        Audio1.powerup(); openShop();
      } else {
        Audio1.hit();
        card.style.transform='translateX(4px)';
        setTimeout(()=>{ card.style.transform=''; },100);
      }
    });
    grid.appendChild(card);
    drawSkinPreview(cv, skin);
  }
}

function uuidv4(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
let playerId = localStorage.getItem(StoreKeys.playerId);
if(!playerId){ playerId = uuidv4(); localStorage.setItem(StoreKeys.playerId, playerId); }
let playerName = localStorage.getItem(StoreKeys.playerName) || '';
let pendingScoreSubmit = null; // takma ad henüz yokken bekleyen skor

async function submitScoreToCloud(score){
  if(!cloudReady || !db || !playerName) return;
  try{
    await db.collection(LB_COLLECTION).doc(playerId).set({
      name: playerName,
      score: Math.round(score),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
  }catch(e){ console.warn('Skor gönderilemedi', e); }
}

function maybeSubmitScore(score){
  if(!playerName){ pendingScoreSubmit = score; return; }
  submitScoreToCloud(score);
}

async function loadLeaderboard(){
  const listEl = document.getElementById('lbList');
  const meRow = document.getElementById('lbMeRow');
  meRow.innerHTML = '';
  if(!cloudReady){
    listEl.innerHTML = '<div class="lbStatus">Bulut bağlantısı henüz kurulmadı 🙈</div>';
    return;
  }
  listEl.innerHTML = '<div class="lbStatus">Yükleniyor...</div>';
  try{
    const snap = await db.collection(LB_COLLECTION).orderBy('score','desc').limit(50).get();
    if(snap.empty){
      listEl.innerHTML = '<div class="lbStatus">Henüz kimse skor göndermedi. İlk sen ol!</div>';
      return;
    }
    listEl.innerHTML = '';
    let rank = 0;
    let meFound = false;
    snap.forEach(doc=>{
      rank++;
      const d = doc.data();
      const row = document.createElement('div');
      const isMe = doc.id === playerId;
      if(isMe) meFound = true;
      row.className = 'lbRow' + (isMe? ' me':'');
      const rankClass = rank===1?'top1':rank===2?'top2':rank===3?'top3':'';
      row.innerHTML = `<div class="lbRank ${rankClass}">${rank}</div><div class="lbName">${escapeHtml(d.name||'???')}</div><div class="lbScore">${d.score} m</div>`;
      listEl.appendChild(row);
    });
    if(!meFound && playerName){
      meRow.innerHTML = '<div class="lbStatus">Henüz ilk 50 içinde değilsin, yükseğe zıpla! 🚀</div>';
    }
  }catch(e){
    console.warn('Skor tablosu alınamadı', e);
    listEl.innerHTML = '<div class="lbStatus">Skor tablosu yüklenemedi, tekrar dene.</div>';
  }
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function openLeaderboard(fromScreen){

  showScreen('screen-leaderboard');
  document.getElementById('screen-leaderboard').dataset.returnTo = fromScreen || 'screen-menu';
  loadLeaderboard();
}
